<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIAWARATRADEMARKET 🏪</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
      }

      /* HEADER */
      header {
        background: #1e293b;
        padding: 20px;
        text-align: center;
      }

      header h1 {
        margin: 0;
        color: #38bdf8;
      }

      /* NAV */
      nav {
        background: #0ea5e9;
        padding: 10px;
        text-align: center;
      }

      nav a {
        color: white;
        margin: 0 15px;
        text-decoration: none;
        font-weight: bold;
      }

      /* SECTION */
      .section {
        padding: 40px;
        text-align: center;
      }

      /* GRID */
      .market-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }

      /* CARD */
      .card {
        background: #1e293b;
        padding: 20px;
        margin: 15px;
        width: 250px;
        border-radius: 10px;
        transition: 0.3s;
      }

      .card:hover {
        transform: scale(1.05);
      }

      /* IMAGE */
      .market-img {
        width: 100%;
        border-radius: 10px;
        margin-top: 10px;
      }

      /* BUTTON */
      button {
        background: #38bdf8;
        border: none;
        padding: 10px;
        margin-top: 10px;
        width: 100%;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background: #0ea5e9;
      }

      /* FOOTER */
      footer {
        background: #1e293b;
        text-align: center;
        padding: 15px;
        margin-top: 30px;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>DIAWARATRADEMARKET 🏪</h1>
      <p>Buy Vehicles, Buildings & Shops Online</p>
    </header>

    <nav>
      <a href="#">Home</a>
      <a href="#">Market</a>
      <a href="#">Contact</a>
    </nav>

    <div class="section">
      <h2>Marketplace</h2>

      <div class="market-container">
        <div class="card">
          <h3>🚌 School Bus</h3>
          <img
            src="https://cdn.pixabay.com/photo/2016/11/29/03/53/bus-1867059_1280.jpg"
            class="market-img"
          />
          <button onclick="buy('School Bus')">Buy 💰</button>
        </div>

        <div class="card">
          <h3>🚗 Car</h3>
          <img
            src="https://cdn.pixabay.com/photo/2016/03/27/22/16/car-1283947_1280.jpg"
            class="market-img"
          />
          <button onclick="buy('Car')">Buy 💰</button>
        </div>

        <div class="card">
          <h3>🏢 Building</h3>
          <img
            src="https://cdn.pixabay.com/photo/2016/11/29/09/32/architecture-1868667_1280.jpg"
            class="market-img"
          />
          <button onclick="buy('Building')">Buy 💰</button>
        </div>

        <div class="card">
          <h3>🛍 Shop</h3>
          <img
            src="https://cdn.pixabay.com/photo/2016/11/29/05/08/store-1868711_1280.jpg"
            class="market-img"
          />
          <button onclick="buy('Shop')">Buy 💰</button>
        </div>
      </div>
    </div>

    <footer>
      <p>© 2026 DIAWARATRADEMARKET | Built by Toumany</p>
    </footer>

    <script>
      function buy(item) {
        alert("🛒 You selected: " + item + "\nWe will contact you soon!");
      }
    </script>
  </body>
</html>
