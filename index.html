<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toumany's Website</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
      }

      header {
        background: #1e293b;
        padding: 20px;
        text-align: center;
      }

      nav {
        background: #0ea5e9;
        padding: 10px;
        text-align: center;
      }

      nav a {
        color: white;
        margin: 0 15px;
        text-decoration: none;
        font-weight: bold;
      }

      .hero {
        padding: 60px;
        text-align: center;
      }

      .hero h1 {
        font-size: 40px;
        color: #38bdf8;
      }

      .section {
        padding: 40px;
        text-align: center;
      }

      .card {
        background: #1e293b;
        padding: 20px;
        margin: 20px auto;
        width: 300px;
        border-radius: 10px;
      }

      footer {
        background: #1e293b;
        text-align: center;
        padding: 15px;
      }

      button {
        background: #38bdf8;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background: #0ea5e9;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Toumany's Website 🚀</h1>
      <p>Learning HTML, Git & Coding</p>
    </header>

    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Projects</a>
    </nav>

    <div class="hero">
      <h1>Welcome 👋</h1>
      <p>This is my first real website</p>
      <button onclick="hello()">Click Me</button>
    </div>

    <div class="section">
      <h2>About Me</h2>
      <div class="card">
        <p>
          I am learning programming and building projects with HTML, Python, and
          Git.
        </p>
      </div>
    </div>

    <div class="section">
      <h2>My Projects</h2>
      <div class="card">
        <p>✔ First Website</p>
        <p>✔ Python Learning App</p>
      </div>
    </div>

    <footer>
      <p>© 2026 Toumany | Built with HTML</p>
    </footer>

    <script>
      function hello() {
        alert("Welcome to my website 🔥");
      }
    </script>
  </body>
</html>
